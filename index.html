<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GILD 会員管理</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GILD会員管理">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#1d1d1b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" href="icon-512.png">
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1d1d1b; --sub:#6b6a66; --line:#e4e1d8;
  --gold:#a8843f; --gold-soft:#f3ecdd; --dark:#1d1d1b;
  --red:#b54a3c; --red-soft:#f8e6e2; --green:#3f7d5a; --green-soft:#e3f0e8;
  --blue:#3d6a8c; --blue-soft:#e3edf4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:15px;line-height:1.6}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* header */
header{background:var(--dark);color:#fff;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
.hd{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 18px}
.logo{font-weight:700;letter-spacing:.18em;font-size:18px}
.logo span{color:var(--gold);}
.logo small{font-weight:400;letter-spacing:.05em;font-size:12px;color:#bbb;margin-left:8px}
nav{display:flex;gap:4px;margin-left:auto}
nav button{background:none;border:0;color:#ccc;padding:6px 12px;border-radius:6px}
nav button.on{background:#333;color:#fff}
.user{display:none}
.hd{position:relative}
.logo,.logo small{white-space:nowrap}
nav button{white-space:nowrap}
.mbar{display:flex;align-items:center;gap:6px;margin-left:10px;position:relative}
.mbar>button{background:none;border:1px solid #555;color:#ddd;border-radius:6px;padding:4px 10px;font-size:13px;white-space:nowrap}
.mbar>button:hover{border-color:var(--gold);color:#fff}
#mBtn{font-size:16px;line-height:1;padding:5px 11px}
.mmenu{position:absolute;top:calc(100% + 8px);right:0;background:#262624;border:1px solid #444;border-radius:10px;padding:10px;min-width:230px;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:40}
.mmenu.hidden{display:none}
.mm-mail{font-size:12px;color:#aaa;padding:2px 4px 6px;border-bottom:1px solid #3a3a38;word-break:break-all}
.mmenu button{background:none;border:0;color:#eee;text-align:left;padding:8px 6px;border-radius:6px;font-size:14px}
.mmenu button:hover{background:#3a3833}
.user button{background:none;border:1px solid #555;color:#ccc;border-radius:5px;padding:2px 8px;margin-left:6px;font-size:12px;white-space:nowrap}
.demo{background:var(--gold);color:#fff;text-align:center;font-size:12px;padding:3px}

main{max-width:1100px;margin:0 auto;padding:18px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h3 .cnt{background:var(--gold-soft);color:var(--gold);border-radius:10px;padding:0 8px;font-size:12px;margin-left:6px}
.empty{color:var(--sub);font-size:13px;padding:6px 0}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .nm{font-weight:600;cursor:pointer}
.row .nm:hover{color:var(--gold)}
.row .meta{color:var(--sub);font-size:12px}
.row .grow{flex:1;min-width:0}
.tag{display:inline-block;font-size:11px;border-radius:4px;padding:0 6px;line-height:18px;white-space:nowrap}
.t-store{background:var(--blue-soft);color:var(--blue)}
.t-online{background:var(--green-soft);color:var(--green)}
.t-both{background:var(--gold-soft);color:var(--gold)}
.t-red{background:var(--red-soft);color:var(--red)}
.t-gray{background:#eee;color:#777}
.t-green{background:var(--green-soft);color:var(--green)}
.t-orange{background:#fbefdc;color:#a8661c}

.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 12px;font-size:13px}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--dark);color:#fff;border-color:var(--dark)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.danger{color:var(--red)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:180px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#fff}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 11px;font-size:12px}
.iss-note{font-size:13px;border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:6px 0;white-space:pre-wrap}
.iss-grid{display:grid;grid-template-columns:minmax(320px,2fr) 3fr;gap:16px;align-items:start}
.iss-side{position:sticky;top:96px;max-height:calc(100vh - 116px);overflow:auto;margin:0}
.iss-row.sel{background:var(--gold-soft)}
.iss-row .chev2{color:#b9ad97;font-size:11px;align-self:center}
.iss-inline .iss-dtitle{visibility:hidden}
@media (max-width:560px){.nin{grid-template-columns:1fr!important}}
.iss-inline{border:1px solid var(--line);border-radius:10px;padding:14px;margin:4px 0 10px;background:#fff}
.iss-dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 6px;font-size:14px}.iss-dl dt{color:#888;font-size:13px}.iss-dl dd{margin:0}
.iss-sec{font-weight:700;font-size:13px;color:#555;margin:14px 0 6px;padding-top:10px;border-top:1px solid var(--line)}
.sub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px;margin-bottom:6px}
.sub-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}
@media (max-width:560px){.sub-grid{grid-template-columns:1fr}}
.iss-plan{font-size:13px;white-space:pre-wrap;margin-top:3px;color:#444}
.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}

/* table */
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}
.tbl th{background:#faf9f5;color:var(--sub);font-weight:500;font-size:12px}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#fbf8f1}
.tbl tr.left td{color:#aaa}
.scroll{overflow-x:auto;border-radius:10px}

/* payment grid */
.pay th,.pay td{text-align:center;padding:7px 6px}
.pay td.nmc,.pay th.nmc{text-align:left;position:sticky;left:0;background:#fff;z-index:1}
.pay th.nmc{background:#faf9f5}
.pc{width:34px;height:26px;border-radius:5px;border:1px solid var(--line);background:#fff;font-size:12px}
.pc.paid{background:var(--green);border-color:var(--green);color:#fff}
.pc.unpaid{background:var(--red-soft);border-color:#ebc6bf;color:var(--red)}
.pc.na{background:#f1f0ec;border-color:#f1f0ec;color:#ccc;cursor:default}

/* detail */
.back{background:none;border:0;color:var(--sub);padding:0;margin-bottom:10px}
.dhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.dhead .big{font-size:20px;font-weight:700}
.dhead .nick{color:var(--sub)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:13px;margin-top:10px}
.kv dt{color:var(--sub)}
.kv dd{margin:0}
.strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.strip .m{text-align:center;font-size:11px;color:var(--sub)}
.mtg{border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:10px;background:#fff}
.mtg .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mtg .dt{font-weight:600}
.mtg .lbl{font-size:11px;color:var(--sub);margin-top:8px}
.mtg .care{background:var(--red-soft);border-radius:6px;padding:6px 10px;white-space:pre-wrap;font-size:13px}
.mtg .care.done{background:#f1f0ec;color:#888}
.mtg .nxt{background:var(--blue-soft);border-radius:6px;padding:6px 10px;white-space:pre-wrap;font-size:13px}
.mtg details{margin-top:8px}
.mtg summary{font-size:12px;color:var(--sub);cursor:pointer}
.mtg pre{white-space:pre-wrap;font-family:inherit;font-size:13px;background:#faf9f5;border-radius:6px;padding:8px 10px;margin:6px 0 0}
.mtg .acts{margin-left:auto;display:flex;gap:6px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow-y:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:560px;padding:20px}
.modal h3{font-size:16px;margin-bottom:14px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff}
.f textarea{min-height:80px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:6px;font-size:14px}
.chk input{width:auto}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.hint{font-size:12px;color:var(--sub)}

/* login */
.login{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px}
.login .logo{color:var(--ink);text-align:center;margin-bottom:18px;font-size:22px}
.err{color:var(--red);font-size:13px;min-height:20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat .num{font-size:24px;font-weight:700}
.stat .num small{font-size:12px;font-weight:400;color:var(--sub)}
.red{color:var(--red)}
.printonly{display:none}
/* ホーム */
.hstats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.hstat{cursor:pointer;margin:0;padding:14px 16px;transition:border-color .15s}
.hstat:hover{border-color:var(--gold)}
.hstat .num{font-size:26px;font-weight:700;line-height:1.3}
.hstat .num small{font-size:12px;font-weight:400;color:var(--sub);margin-left:2px}
.hgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.dayh{font-weight:700;font-size:13px;margin:14px 0 2px;padding:4px 0;border-bottom:2px solid var(--gold-soft)}
.dayh:first-of-type{margin-top:4px}
.mtime{font-weight:700;font-size:15px;min-width:52px;color:var(--ink);padding-top:1px}
.carebox{background:var(--red-soft);border-radius:6px;padding:4px 8px;font-size:12px;margin-top:4px}
.carebox b{color:var(--red);margin-right:4px}
@media (max-width:1200px){.hstats{grid-template-columns:repeat(3,1fr)}}
@media (max-width:900px){.hgrid{grid-template-columns:1fr}}
@media (max-width:560px){.hstats{grid-template-columns:repeat(2,1fr)}}
/* GAIN未入金：会員ごとに開閉 */
.card.arr{padding:0;overflow:hidden}
.arrhead{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
.arrhead:hover{background:#fbf8f1}
.arrhead .grow{flex:1;min-width:0}
.arrhead .chev{color:var(--sub);font-size:11px;transition:transform .15s;width:12px}
.card.arr.open .chev{transform:rotate(90deg)}
.arrbody{display:none;padding:0 16px 14px;border-top:1px solid var(--line)}
.card.arr.open .arrbody{display:block}
.card.arr{margin-bottom:8px}
@media print{.arrbody{display:block!important}.chev{display:none}}
.rowlink{cursor:pointer;border-radius:6px;margin:0 -8px;padding-left:8px;padding-right:8px;position:relative}
.rowlink:hover{background:#fbf8f1}
.rowlink .nm{color:var(--ink)}
.rowlink:hover .nm{color:var(--gold)}
.pfee{font-size:10px;color:var(--sub);margin-top:2px;line-height:1}
.pay .sumc{text-align:right;white-space:nowrap;padding-left:14px}
.pay tr.ptotal td{background:#faf9f5;font-size:12px}
.pc.part{background:#fbefdc;border-color:#ecd3a9;color:#a8661c;font-size:11px}
/* ページ見出しバー */
.pbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px}
.pbar h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.03em}
.pbar .pdate{color:var(--sub);font-size:13px}
.pbar .pact{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* PCの広い画面：左側にメニュー */
@media (min-width:1000px){
  header{position:fixed;top:0;left:0;bottom:0;width:220px;z-index:30}
  .hd{flex-direction:column;align-items:stretch;height:100%;max-width:none;margin:0;padding:24px 14px 18px;gap:26px}
  .logo{padding:0 8px;font-size:20px}
  .logo small{display:block;margin:4px 0 0;font-size:12px}
  nav{flex-direction:column;margin-left:0;gap:4px}
  nav button{text-align:left;padding:10px 12px;font-size:15px;border-radius:8px}
  nav button:hover{background:#2a2a28;color:#fff}
  nav button.on{background:#3a3833;color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
  .user{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:12px}
  .mbar{display:none}
  .user span{word-break:break-all;font-size:11px;color:#999;padding:0 4px 4px;line-height:1.4}
  .user button{margin-left:0;padding:8px 10px;text-align:left;font-size:13px;border-color:#444}
  .user button:hover{border-color:var(--gold);color:#fff}
  .demo{margin-left:220px}
  main{margin-left:220px;max-width:1500px;padding:0 32px 24px}
  .pbar{background:var(--dark);color:#fff;margin:0 -32px 22px;padding:14px 32px;min-height:62px;position:sticky;top:0;z-index:15}
  .pbar .pdate{color:#a8a59c}
  .pbar .btn{background:none;border-color:#555;color:#ddd}
  .pbar .btn:hover{border-color:var(--gold);color:#fff}
  .pbar .btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
  .pbar .back{color:#bbb;margin:0}
}
@media print{
  main{margin-left:0!important}
  .pbar{display:none!important}
  header,.demo,.noprint,.toast,#modalRoot{display:none!important}
  .printonly{display:block}
  body{background:#fff;font-size:12px}
  .card{break-inside:avoid;border-color:#ccc}
  main{max-width:none;padding:0}
}
@media (max-width:760px){
  .grid3{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .hd{flex-wrap:wrap;gap:8px;padding:10px 12px}
  nav{margin-left:0;order:3;width:100%}
  nav button{flex:1;white-space:nowrap;padding:6px 2px;font-size:14px}
  .mbar{margin-left:auto}
  main{padding:12px}
  .f2{grid-template-columns:1fr}
  .hide-sp{display:none}
}
</style>
</head>
<body>

<!-- ログイン -->
<div id="loginView" class="hidden">
  <div class="login">
    <div class="logo">G<span>I</span>LD <small style="display:block;letter-spacing:.05em;font-size:12px;color:#888;font-weight:400">会員管理</small></div>
    <div class="f"><label>メールアドレス</label><input id="lgEmail" type="email" autocomplete="username"></div>
    <div class="f"><label>パスワード</label><input id="lgPass" type="password" autocomplete="current-password"></div>
    <div class="err" id="lgErr"></div>
    <button class="btn pri" style="width:100%;padding:10px" onclick="doLogin()">ログイン</button>
    <div style="text-align:center;margin-top:14px"><button class="back" style="margin:0;font-size:13px;text-decoration:underline" onclick="forgotPw()">パスワードを忘れた場合</button></div>
  </div>
</div>

<!-- アプリ本体 -->
<div id="appView" class="hidden">
  <div id="demoBar" class="demo hidden">デモモード：入力した内容は保存されません（Firebaseの設定をすると保存されます）</div>
  <header>
    <div class="hd">
      <div class="logo">G<span>I</span>LD<small>会員管理</small></div>
      <nav>
        <button data-tab="home" class="on" onclick="go('home')">ホーム</button>
        <button data-tab="members" onclick="go('members')">会員</button>
        <button data-tab="issues" onclick="go('issues')">運営課題</button>
        <button data-tab="pay" onclick="go('pay')">支払い</button>
        <button data-tab="arrears" onclick="go('arrears')">GAIN未入金</button>
      </nav>
      <div class="user"><span id="userEmail" class="hide-sp"></span><button onclick="refreshApp()" title="最新の状態に更新">↻ 更新</button><button onclick="openPw()">パスワード変更</button><button onclick="logout()">ログアウト</button></div>
      <div class="mbar">
        <button onclick="refreshApp()" title="最新の状態に更新">↻ 更新</button>
        <button id="mBtn" onclick="toggleMenu(event)" aria-label="メニュー">☰</button>
        <div id="mmenu" class="mmenu hidden" onclick="event.stopPropagation()">
          <div class="mm-mail" id="mmEmail"></div>
          <button onclick="toggleMenu();openPw()">パスワード変更</button>
          <button onclick="toggleMenu();logout()">ログアウト</button>
        </div>
      </div>
    </div>
  </header>
  <main>
    <section id="v-home"></section>
    <section id="v-members" class="hidden"></section>
    <section id="v-detail" class="hidden"></section>
    <section id="v-pay" class="hidden"></section>
    <section id="v-arrears" class="hidden"></section>
    <section id="v-issues" class="hidden"></section>
  </main>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   設定：Firebaseの設定をここに入れると保存されるようになります。
   空のままだと「デモモード」（保存されない）で動きます。
   ========================================================= */
const CONFIG = {
  apiKey: "AIzaSyBzszVhMqVUbexsMmqUBSFVd09H1FtYMWY",
  databaseURL: "https://gild-members-default-rtdb.asia-southeast1.firebasedatabase.app",
  allowedEmails: [   // ログインできるメールアドレス
    "kanetaka.hinako_02@icloud.com", // Hina
    "dorainpact@gmail.com",          // HAK代表
    "kanetaka.koki_01@icloud.com",   // KANETAKA代表
  ],
  hosts: ["KANETAKA代表", "HAK代表"], // ミーティング担当者の選択肢
  idleDays: 45      // この日数以上ミーティングしていない会員を「フォローが必要」に表示
};

const DEMO = !CONFIG.apiKey || !CONFIG.databaseURL;
const COURSES = { none: "未設定", store: "店舗", online: "電脳", both: "店舗・電脳" };
const STATUS = { active: "在籍", leaving: "退会予定", paused: "休会", left: "退会" };
const LOG_TYPES = { contact: "連絡", consult: "相談", warning: "注意", violation: "約束違反" };
const LOG_ACTIONS = ["口頭で注意", "書面で警告", "退会をお願いした", "その他"];
const CONTRACT = { none: "未送付", sent: "送付済み", signed: "締結済み" };
const logsOf = id => Object.entries(state.logs || {}).filter(([, x]) => x.memberId === id).map(([lid, x]) => ({ id: lid, ...x })).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
const refName = m => m.referrerId && state.members[m.referrerId] ? state.members[m.referrerId].name + (state.members[m.referrerId].nick ? "（" + state.members[m.referrerId].nick + "）" : "") : (m.referrer || "");
const referredBy = id => membersArr().filter(x => x.referrerId === id).sort(byNo);
const warnCount = id => logsOf(id).filter(x => x.type === "warning" || x.type === "violation").length;
const LEAVE_CHECKS = { date: "退会日を確定した", pay: "月額などの支払いを精算した", gild: "gild.lifeのアカウントを停止した", line: "グループLINEの退出を確認した", gain: "GAIN未入金の聞き取りが済んでいる" };
const leaveDone = m => Object.keys(LEAVE_CHECKS).filter(k => m.leaveChecks?.[k]).length;
const stTag = st => st && st !== "active" ? ` <span class="tag ${st === "leaving" ? "t-orange" : "t-gray"}">${STATUS[st]}</span>` : "";

let state = { members: {}, meetings: {}, payments: {}, arrears: {}, logs: {}, formTokens: {}, formSubs: {}, formLookup: {}, formConfig: {}, issues: {} };

async function doLogin() {
  const email = $("lgEmail").value.trim(), password = $("lgPass").value;
  $("lgErr").textContent = "";
  if (CONFIG.allowedEmails.length && !CONFIG.allowedEmails.includes(email)) { $("lgErr").textContent = "このメールアドレスは利用できません"; return; }
  try {
    const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${CONFIG.apiKey}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password, returnSecureToken: true })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error?.message || "error");
    auth = { email: j.email, idToken: j.idToken, refreshToken: j.refreshToken, exp: Date.now() + (Number(j.expiresIn) - 60) * 1000 };
    sessionStorage.setItem("gildAuth", JSON.stringify(auth));
    await startApp();
  } catch (e) {
    $("lgErr").textContent = "ログインできませんでした（メールアドレスまたはパスワードを確認してください）";
  }
}
async function token() {
  if (auth && Date.now() < auth.exp) return auth.idToken;
  const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${CONFIG.apiKey}`, {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(auth.refreshToken)}`
  });
  const j = await r.json();
  if (!r.ok) { logout(); throw new Error("session expired"); }
  auth.idToken = j.id_token; auth.refreshToken = j.refresh_token; auth.exp = Date.now() + (Number(j.expires_in) - 60) * 1000;
  sessionStorage.setItem("gildAuth", JSON.stringify(auth));
  return auth.idToken;
}

async function db(method, path, body) {

}
async function save(method, path, body) {

/* ---------- 計算 ---------- */
const byKana = (a, b) => (a.kana || a.name || "").localeCompare(b.kana || b.name || "", "ja");
const byNo = (a, b) => (a.salonNo ? 0 : 1) - (b.salonNo ? 0 : 1) || String(a.salonNo || "").localeCompare(String(b.salonNo || ""), "ja", { numeric: true }) || byKana(a, b);
function memSort(a, b) {
  const k = ui.memSort || "no", dir = ui.memDir || 1;
  const date = (x, y) => (x ? 0 : 1) - (y ? 0 : 1) || (x || "").localeCompare(y || "") * dir;
  if (k === "kana") return byKana(a, b) * dir;
  if (k === "next") return date(a.nextMtg, b.nextMtg) || byNo(a, b);
  if (k === "last") return date(lastMtg(a.id), lastMtg(b.id)) || byNo(a, b);
  return (a.salonNo ? 0 : 1) - (b.salonNo ? 0 : 1) || String(a.salonNo || "").localeCompare(String(b.salonNo || ""), "ja", { numeric: true }) * dir || byKana(a, b);
}
function setSort(k) { if ((ui.memSort || "no") === k) ui.memDir = -(ui.memDir || 1); else { ui.memSort = k; ui.memDir = 1; } renderMembersTable(); }
const membersArr = () => Object.entries(state.members).map(([id, m]) => ({ id, ...m }));
const meetingsOf = id => Object.entries(state.meetings).filter(([, x]) => x.memberId === id).map(([mid, x]) => ({ id: mid, ...x })).sort((a, b) => (a.date ? 0 : 1) - (b.date ? 0 : 1) || (b.date || "").localeCompare(a.date || ""));
const lastMtg = id => meetingsOf(id).find(x => x.date)?.date || "";
const hasMtg = id => meetingsOf(id).length > 0;
const lastLabel = (id, long) => lastMtg(id) ? (long ? fmtDY(lastMtg(id)) : fmtD(lastMtg(id))) : hasMtg(id) ? "日付不明" : (long ? "記録なし" : "—");
const nextLabel = (m, long) => m.nextMtg ? (long ? fmtDY(m.nextMtg) : fmtD(m.nextMtg)) + (m.nextMtgTime ? " " + m.nextMtgTime + "〜" : "") : "—";
const openCare = id => meetingsOf(id).filter(x => x.care && !x.careDone);
const isPaid = (id, k) => !!state.payments[id]?.[k];
// 月額の変更履歴：feeHistory = [{ from: "YYYY-MM", fee }]。その月より前は基本の月額（m.fee）
const histOf = m => (m.feeHistory ? Object.values(m.feeHistory) : []).filter(h => h && h.from).sort((a, b) => a.from.localeCompare(b.from));
function feeFor(m, k) { let f = m.fee; for (const h of histOf(m)) if (h.from <= k) f = h.fee; return f == null || f === "" ? null : Number(f); }
const paidAmt = (m, k) => { const v = state.payments[m.id]?.[k]; return typeof v === "number" ? v : v ? (feeFor(m, k) || 0) : 0; };
// 入会金：entryPays = { id: { date, amount, memo } }、entryPlan = 分割の約束（文字）
const entryPaysOf = m => Object.entries(m.entryPays || {}).map(([pid, x]) => ({ pid, ...x })).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
function entryInfo(m) {
  const fee = m.entryFee == null || m.entryFee === "" ? null : Number(m.entryFee), pays = entryPaysOf(m);
  let paid = pays.reduce((a, x) => a + (Number(x.amount) || 0), 0);
  if (!pays.length && m.entryPaid) paid = fee || 0;
  const st = fee == null ? (m.entryPaid || paid ? "done" : "none") : paid >= fee && (paid > 0 || m.entryPaid) ? "done" : paid > 0 ? "part" : "none";
  return { fee, paid, rest: fee == null ? 0 : Math.max(fee - paid, 0), st, pays, installment: !!m.entryPlan || pays.length > 1 || st === "part" };
}
const man = v => (Math.round(v / 1000) / 10).toLocaleString() + "万";
const ymLabel = k => `${k.slice(0, 4)}年${Number(k.slice(5))}月`;
function yearSums(m, y) {
  const now = curYM(); let paid = 0, due = 0;
  for (let i = 1; i <= 12; i++) { const k = `${y}-${String(i).padStart(2, "0")}`; if (!monthApplies(m, k)) continue;
    if (isPaid(m.id, k)) paid += paidAmt(m, k); else if (k <= now) due += feeFor(m, k) || 0; }
  return { paid, due };
}
function monthApplies(m, k) {
  // 入会月以降で、退会していない月だけ支払い対象にする
  if (m.joinDate && k < ym(m.joinDate)) return false;
  if ((m.status === "left" || m.status === "leaving") && m.leftDate && k > ym(m.leftDate)) return false;
  if (m.status === "left" && !m.leftDate) return false;
  return true;
}

  <div class="hgrid">

      </div>
      ${leaving.length ? `<div class="card"><h3>退会予定<span class="cnt">${leaving.length}</span><span class="meta" style="font-weight:400;margin-left:8px">予定日が近い順（未定はサロンNo順）</span></h3>
        ${leaving.map(m => { const n = m.leftDate ? daysFrom(m.leftDate) : null, done = leaveDone(m), all = Object.keys(LEAVE_CHECKS).length;
          return `<div class="row rowlink" onclick="openRow('${m.id}','d-leave')"><div class="grow">${nm(m)}<div class="meta">退会予定日：${m.leftDate ? fmtDY(m.leftDate) : "未定"}${m.leaveReason ? "　" + esc(m.leaveReason) : ""}</div></div>
          ${n !== null && n < 0 ? `<span class="tag t-red">予定日を過ぎています</span>` : ""}<span class="tag ${done === all ? "t-green" : "t-orange"}">手続き ${done}/${all}</span></div>`; }).join("")}
      </div>` : ""}

    <div>
      <div class="card" id="hCare"><h3 style="display:flex;align-items:center">運営の課題・やること<span class="cnt">${todo.length}</span><button class="btn sm" style="margin-left:auto" onclick="openIssue()">＋ 課題を追加</button></h3>
        ${todo.length ? cut(todo, "care").map(t => t.iss ? issRow(t.iss) : careRow(t)).join("") + more("care", todo.length) : `<div class="empty">未完了のものはありません</div>`}
      </div>
      <div class="card"><h3>フォローが必要<span class="cnt">${idle.length}</span><span class="meta" style="font-weight:400;margin-left:8px">${CONFIG.idleDays}日以上ミーティングなし・次回未定</span></h3>
        ${idle.length ? cut(idle, "idle").map(m => `<div class="row rowlink" onclick="openRow('${m.id}')"><div class="grow">${nm(m)} ${courseTag(m.course)}<div class="meta">前回：${lastLabel(m.id, true)}</div></div><button class="btn sm" onclick="event.stopPropagation();openMember('${m.id}')">次回MTGを入れる</button></div>`).join("") + more("idle", idle.length) : `<div class="empty">該当する会員はいません</div>`}
      </div>
      ${entryPart.length ? `<div class="card"><h3>入会金 分割中<span class="cnt">${entryPart.length}</span><span class="meta" style="font-weight:400;margin-left:8px">残り合計 ${entryPart.reduce((a, m) => a + entryInfo(m).rest, 0).toLocaleString()}円</span></h3>
        ${cut(entryPart, "entry").map(m => { const e = entryInfo(m), last = e.pays[e.pays.length - 1];
          return `<div class="row rowlink" onclick="openRow('${m.id}')"><div class="grow">${nm(m)}<div class="meta">残り ${e.rest.toLocaleString()}円（払った額 ${e.paid.toLocaleString()}円）${last ? "　前回 " + (last.date ? fmtD(last.date) : "日付不明") : ""}${m.entryPlan ? "　" + esc(m.entryPlan) : ""}</div></div><button class="btn sm" onclick="event.stopPropagation();openEntry('${m.id}')">支払いを記録</button></div>`; }).join("") + more("entry", entryPart.length)}
      </div>` : ""}
      <div class="card"><h3>${Number(k.slice(5))}月分の月額 未払い<span class="cnt">${unpaid.length}</span></h3>
        ${unpaid.length ? cut(unpaid, "unpaid").map(m => `<div class="row rowlink" onclick="openRow('${m.id}')"><div class="grow">${nm(m)}<div class="meta">月額 ${yen(feeFor(m, k))}</div></div><button class="btn sm" onclick="event.stopPropagation();togglePay('${m.id}','${k}')">支払い済みにする</button></div>`).join("") + more("unpaid", unpaid.length) : `<div class="empty">全員支払い済みです</div>`}
      </div>
    </div>
  </div>`;
}

/* ---------- 会員一覧 ---------- */
function renderMembers() {
  let list = membersArr();
  if (ui.status !== "all") list = list.filter(m => (m.status || "active") === ui.status);
  if (ui.contract && ui.contract !== "all") list = list.filter(m => (m.contractStatus || "none") === ui.contract);
  if (ui.course !== "all") list = list.filter(m => m.course === ui.course || (ui.course !== "both" && ui.course !== "none" && m.course === "both"));
  const q = ui.search.trim().toLowerCase();
  if (q) list = list.filter(m => [m.name, m.nick, m.kana, m.memo, m.salonNo, m.email, m.phone, refName(m)].some(v => String(v || "").toLowerCase().includes(q)));
  list.sort(memSort);
  const k = curYM();
  const chip = (key, val, label) => `<button class="chip ${ui[key] === val ? "on" : ""}" onclick="ui.${key}='${val}';renderMembers()">${label}</button>`;
  $("v-members").innerHTML = pbar("会員一覧", `<button class="btn hide-sp" onclick="exportCSV()">CSVで書き出し</button><button class="btn" onclick="openBulk()">まとめて登録</button><button class="btn" onclick="openSched()">MTG予定をまとめて登録</button><button class="btn gold" onclick="openMember()">＋ 会員を追加</button>`) + `
  <div class="toolbar">
    <input type="search" placeholder="名前・サロン名・サロンNo・メールで検索" value="${esc(ui.search)}" oninput="ui.search=this.value;renderMembersTable()">
  </div>
  <div class="toolbar">
    <div class="chips">${chip("course", "all", "すべてのコース")}${chip("course", "store", "店舗")}${chip("course", "online", "電脳")}${chip("course", "both", "両方")}${chip("course", "none", "未設定")}</div>
    <div class="chips"><span class="meta" style="align-self:center">契約書：</span>${chip("contract", "all", "すべて")}${chip("contract", "none", "未送付")}${chip("contract", "sent", "送付済み")}${chip("contract", "signed", "締結済み")}</div>
    <div class="chips" style="margin-left:auto">${chip("status", "active", "在籍")}${chip("status", "leaving", "退会予定")}${chip("status", "paused", "休会")}${chip("status", "left", "退会")}${chip("status", "all", "すべて")}</div>
  </div>
  <div id="memTable"></div>`;
  renderMembersTable(list);
}
function sortTh(k, label, cls = "") {
  const on = (ui.memSort || "no") === k, arrow = on ? ((ui.memDir || 1) > 0 ? " ▲" : " ▼") : "";
  return `<th class="${cls}" style="cursor:pointer;${on ? "color:var(--ink)" : ""}" onclick="setSort('${k}')">${label}${arrow}</th>`;
}
function renderMembersTable(list) {
  if (!list) { // 検索入力時：フォーカスを保ったまま表だけ更新
    let l = membersArr();
    if (ui.status !== "all") l = l.filter(m => (m.status || "active") === ui.status);
    if (ui.contract && ui.contract !== "all") l = l.filter(m => (m.contractStatus || "none") === ui.contract);
  if (ui.course !== "all") l = l.filter(m => m.course === ui.course || (ui.course !== "both" && ui.course !== "none" && m.course === "both"));
    const q = ui.search.trim().toLowerCase();
    if (q) l = l.filter(m => [m.name, m.nick, m.kana, m.memo, m.salonNo, m.email, m.phone, refName(m)].some(v => String(v || "").toLowerCase().includes(q)));
    l.sort(memSort);
    list = l;
  }
  const k = curYM();
  $("memTable").innerHTML = list.length ? `
  <div class="scroll"><table class="tbl">
    <tr>${[["no", "No"], ["kana", "氏名"]].map(([k, l]) => sortTh(k, l)).join("")}<th>サロン名</th><th>コース</th>${sortTh("next", "次回MTG")}${sortTh("last", "前回MTG", "hide-sp")}<th>今月</th><th>未対応</th></tr>
    ${list.map(m => {
      const c = openCare(m.id).length;
      const pay = !monthApplies(m, k) ? `<span class="tag t-gray">対象外</span>` : isPaid(m.id, k) ? `<span class="tag t-green">済</span>` : `<span class="tag t-red">未</span>`;
      return `<tr class="click ${m.status === "left" ? "left" : ""}" onclick="go('detail','${m.id}')">
        <td class="meta">${esc(m.salonNo || "")}</td><td><b>${esc(m.name)}</b>${stTag(m.status)}${warnCount(m.id) ? ` <span class="tag t-red">注意${warnCount(m.id)}</span>` : ""}</td>
        <td>${esc(m.nick || "")}</td><td>${courseTag(m.course)}</td>
        <td>${nextLabel(m)}</td><td class="hide-sp">${lastLabel(m.id)}</td>
        <td>${pay}</td><td>${c ? `<span class="tag t-red">${c}件</span>` : ""}</td></tr>`;
    }).join("")}
  </table></div>
  <div class="hint" style="margin-top:6px">${list.length}人</div>` : `<div class="card empty">該当する会員はいません</div>`;
}

        ${m.entryPlan ? `<div class="meta">分割の約束：${esc(m.entryPlan)}</div>` : ""}${e.pays.length ? `<div class="meta">${e.pays.map(x => `${x.date ? fmtD(x.date) : "日付不明"} ${Number(x.amount).toLocaleString()}円`).join("　/　")}</div>` : ""}</dd>`; })()}

      <div style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">${Object.entries(CHECK).map(([k, v]) => `<button class="btn sm ${(m.gainCheck || "unchecked") === k ? "pri" : ""}" onclick="setCheck('${id}','${k}')">${v}</button>`).join("")}<button class="btn sm gold" onclick="openArrear('${id}')">＋ 追加</button></div></div>
    ${subsOf(id).length ? `<div class="meta" style="margin-top:6px">フォームの回答：${subsOf(id).map(x => `${new Date(x.at).toLocaleDateString("ja-JP")} ${ANS[x.answer] || ""}${procLabel(x)}`).join("　/　")}</div>` : ""}

  ${mt.length ? mt.map(x => `

      <div class="top"><span class="dt">${x.date ? fmtDY(x.date) : `<span class="tag t-orange">日付不明</span>`}</span>${x.host ? `<span class="tag t-gray">${esc(x.host)}</span>` : ""}

    </div>`).join("") : `<div class="card empty">まだ記録はありません</div>`}`;
}

/* ---------- 支払い表 ---------- */
function renderPay() {
  const y = ui.payYear;

  const list = membersArr().filter(m => m.status !== "left" || months.some(k => monthApplies(m, k)))
    .sort(byNo);
  const k = curYM();
  const unpaidCnt = months.map(mk => list.filter(m => monthApplies(m, mk) && !isPaid(m.id, mk) && mk <= k).length);
  $("v-pay").innerHTML = pbar("支払い", `<button class="btn" onclick="openFeeBulk()">入会金・月額を一括設定</button>`) + `
  <div class="toolbar">
    <button class="btn" onclick="ui.payYear--;renderPay()">◀</button><b>${y}年</b><button class="btn" onclick="ui.payYear++;renderPay()">▶</button>
    <span class="hint" style="margin-left:8px">「未」をタップで支払い済みに。「済」をタップすると金額の修正・未払いに戻すができます。入会前・退会後の月は対象外（−）です。</span>
  </div>
  ${list.length ? `<div class="scroll"><table class="tbl pay">
    <tr><th class="nmc">氏名</th><th>入会金</th>${months.map(mk => `<th>${Number(mk.slice(5))}月</th>`).join("")}<th class="sumc">${y}年 支払い合計</th><th class="sumc">未払い額</th></tr>
    ${list.map(m => `<tr><td class="nmc"><span class="nm" style="cursor:pointer" onclick="go('detail','${m.id}')">${esc(m.name)}</span></td>
      ${(() => { const e = entryInfo(m); return `<td><button class="pc ${e.st === "done" ? "paid" : e.st === "part" ? "part" : "unpaid"}" title="${e.fee != null ? "入会金 " + e.fee.toLocaleString() + "円・支払い済み " + e.paid.toLocaleString() + "円" : ""}" onclick="toggleEntry('${m.id}')">${e.st === "done" ? "済" : e.st === "part" ? "一部" : "未"}</button>${e.fee != null ? `<div class="pfee">${e.st === "part" ? "残" + man(e.rest) : man(e.fee)}</div>` : ""}</td>`; })()}
      ${months.map(mk => { const na = !monthApplies(m, mk), p = isPaid(m.id, mk);
        const f = na ? null : feeFor(m, mk);
        return `<td><button class="pc ${na ? "na" : p ? "paid" : mk > k ? "" : "unpaid"}" title="${na ? "" : p ? "支払い " + paidAmt(m, mk).toLocaleString() + "円" : "月額 " + (f == null ? "未設定" : f.toLocaleString() + "円")}" ${na ? "disabled" : `onclick="togglePay('${m.id}','${mk}')"`}>${na ? "−" : p ? "済" : mk > k ? "" : "未"}</button>${!na && f != null ? `<div class="pfee">${(p ? paidAmt(m, mk) : f) / 10000}万</div>` : ""}</td>`; }).join("")}
      ${(() => { const t = yearSums(m, y); return `<td class="sumc"><b>${t.paid.toLocaleString()}</b></td><td class="sumc ${t.due ? "red" : ""}">${t.due ? t.due.toLocaleString() : "—"}</td>`; })()}
    </tr>`).join("")}
    ${(() => { const mp = months.map(mk => list.reduce((a, m) => a + (monthApplies(m, mk) && isPaid(m.id, mk) ? paidAmt(m, mk) : 0), 0));
      const tp = list.reduce((a, m) => a + yearSums(m, y).paid, 0), td = list.reduce((a, m) => a + yearSums(m, y).due, 0);
      return `<tr class="ptotal"><td class="nmc"><b>月ごとの入金合計</b></td><td></td>${mp.map(v => `<td>${v ? (v / 10000).toLocaleString() + "万" : ""}</td>`).join("")}<td class="sumc"><b>${tp.toLocaleString()}</b></td><td class="sumc red">${td ? td.toLocaleString() : "—"}</td></tr>`; })()}
    <tr><td class="nmc hint">未払い人数</td><td></td>${unpaidCnt.map(n => `<td class="hint">${n || ""}</td>`).join("")}<td></td><td></td></tr>
  </table></div>` : `<div class="card empty">会員が登録されていません</div>`}`;

/* ---------- GAIN未入金 ---------- */
const arrOf = id => Object.entries(state.arrears).filter(([, x]) => x.memberId === id).map(([aid, x]) => ({ id: aid, ...x })).sort((a, b) => (a.date ? 0 : 1) - (b.date ? 0 : 1) || (a.date || "").localeCompare(b.date || ""));
const amtUnknown = x => (x.amount === null || x.amount === undefined || x.amount === "") && !(x.qty != null && x.unitPrice != null);
const arrAmt = x => amtUnknown(x) ? 0 : (Number(x.amount ?? (Number(x.qty || 0) * Number(x.unitPrice || 0))) || 0);
const isOpen = x => (x.status || "unpaid") === "unpaid";
const needFill = x => isOpen(x) && (!x.date || amtUnknown(x));
const openQty = l => l.filter(isOpen).reduce((s, x) => s + (Number(x.qty) || 0), 0);
const arrSum = (list, st) => list.filter(x => !st || (x.status || "unpaid") === st).reduce((s, x) => s + arrAmt(x), 0);

      <td style="text-align:right">${x.qty ?? ""}</td><td style="text-align:right">${x.unitPrice != null ? Number(x.unitPrice).toLocaleString() : ""}</td>

      <td>${x.status === "settled" ? `<span class="tag t-green">精算済み</span><div class="meta">${fmtD(x.settledDate)}${x.settledBy ? " " + esc(x.settledBy) : ""}</div>` : `<span class="tag t-red">未入金</span>`}</td>

      <td class="noprint"><button class="btn sm" onclick="openArrear('${memberId || x.memberId}','${x.id}')">編集</button></td></tr>`).join("")}
  </table></div>`;
}
function renderArrears() {

  const mem = membersArr();
  const total = arrSum(all, "unpaid"), settled = arrSum(all, "settled");
  const checked = mem.filter(m => m.gainCheck && m.gainCheck !== "unchecked").length;
  let list = mem.map(m => { const l = arrOf(m.id); return { m, l, unpaid: arrSum(l, "unpaid"), settled: arrSum(l, "settled"), open: l.filter(isOpen).length, qty: openQty(l), unk: l.filter(x => isOpen(x) && amtUnknown(x)).length }; });
  const f = ui.arrFilter || "unpaid";
  if (f === "settled") list = list.filter(r => r.l.length && r.open === 0);
  if (f === "unchecked") list = list.filter(r => !r.m.gainCheck || r.m.gainCheck === "unchecked");
  if (f === "checking") list = list.filter(r => lastAnswer(r.m.id) === "checking");
  if (f === "unpaid") list = list.filter(r => r.open > 0);
  if (f === "fill") list = list.filter(r => r.l.some(needFill)).map(r => ({ ...r, l: r.l.filter(needFill) }));
  if (f === "needev") list = list.filter(r => r.l.some(needEv)).map(r => ({ ...r, l: r.l.filter(needEv) }));
  if (f === "noev") list = list.filter(r => r.l.some(noEv)).map(r => ({ ...r, l: r.l.filter(noEv) }));
  const needAmt = all.filter(needEv).reduce((s, x) => s + arrAmt(x), 0);
  const noAmt = all.filter(noEv).reduce((s, x) => s + arrAmt(x), 0);
  const unkCnt = all.filter(x => isOpen(x) && amtUnknown(x)).length, dateCnt = all.filter(x => isOpen(x) && !x.date).length;
  const openCnt = all.filter(isOpen).length, qtyAll = openQty(all);

  <div class="grid3">
    <div class="card stat"><div class="hint">未入金 合計</div><div class="num red">${total.toLocaleString()}<small>円</small></div><div class="meta">${openCnt}件・${qtyAll}個</div>${unkCnt ? `<div class="meta" style="color:#a8661c">ほかに金額未確定 ${unkCnt}件</div>` : ""}${dateCnt ? `<div class="meta" style="color:#a8661c">日付不明 ${dateCnt}件</div>` : ""}${needAmt ? `<div class="meta">うち証拠を集める必要あり ${needAmt.toLocaleString()}円</div>` : ""}${noAmt ? `<div class="meta">うち証拠が存在しない ${noAmt.toLocaleString()}円</div>` : ""}</div>
    <div class="card stat"><div class="hint">精算済み 合計</div><div class="num">${settled.toLocaleString()}<small>円</small></div></div>
    <div class="card stat"><div class="hint">会員への聞き取り</div><div class="num">${checked}<small> / ${mem.length}人 確認済み</small></div></div>
  </div>
  <div class="toolbar noprint">
    <div class="chips">${chip("unpaid", "未入金が残っている会員")}${chip("settled", "精算が終わった会員")}${chip("fill", "あとで埋める取引（日付不明・金額未確定）")}${chip("unchecked", "まだ聞き取りしていない会員")}${chip("needev", "証拠を集める必要がある")}${chip("noev", "証拠が存在しない")}${chip("checking", "確認中のまま")}</div>
    <div style="margin-left:auto;display:flex;gap:6px"><button class="btn sm" onclick="arrAll(true)">すべて開く</button><button class="btn sm" onclick="arrAll(false)">すべて閉じる</button></div>
  </div>
  ${list.length ? list.map(r => `
    <div class="card arr ${ui.arrOpen?.[r.m.id] ? "open" : ""}" id="arr-${r.m.id}">
      <div class="arrhead" onclick="toggleArr('${r.m.id}')">
        <span class="chev">▶</span>
        <div class="grow"><span class="meta">${esc(r.m.salonNo || "")}</span> <b>${esc(r.m.name)}</b>${r.m.nick ? ` <span class="meta">（${esc(r.m.nick)}）</span>` : ""}
          <span class="tag ${r.m.gainCheck === "has" ? "t-red" : r.m.gainCheck === "none" ? "t-green" : "t-gray"}">聞き取り：${CHECK[r.m.gainCheck || "unchecked"]}</span>
          ${r.l.some(needFill) ? `<span class="tag t-orange">あとで埋める ${r.l.filter(needFill).length}</span>` : ""}</div>
        <div style="text-align:right;white-space:nowrap"><b class="red" style="font-size:16px">${r.unpaid.toLocaleString()}円</b><div class="meta">${r.open ? `${r.open}件・${r.qty}個${r.unk ? `（金額未確定${r.unk}件）` : ""}` : r.l.length ? "精算済み" : "記録なし"}${r.settled ? `　精算済み ${r.settled.toLocaleString()}円` : ""}</div></div>
      </div>
      <div class="arrbody">
      ${r.l.length ? `<div style="margin-top:10px">${arrTable(r.l, r.m.id)}</div>` : ""}
      <div class="noprint" style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn sm" onclick="openArrear('${r.m.id}')">＋ この会員に追加</button>
        ${Object.entries(CHECK).map(([k, v]) => `<button class="btn sm ${(r.m.gainCheck || "unchecked") === k ? "pri" : ""}" onclick="setCheck('${r.m.id}','${k}')">${v}</button>`).join("")}
        <button class="btn sm" style="margin-left:auto" onclick="go('detail','${r.m.id}')">会員ページへ</button>
      </div>
      </div>
    </div>`).join("") : `<div class="card empty">該当する会員はいません</div>`}`;
}

async function saveArrear(aid, cont) {
  const memberId = $("aMem").value, date = $("aDate").value, item = $("aItem").value.trim(), amt = $("aAmt").value;
  if (!memberId || !item) { alert("会員と商品名を入力してください"); return; }
  const n = v => v === "" ? null : Number(v), st = $("aSt").value;
  const data = { memberId, date, item, qty: n($("aQty").value), unitPrice: n($("aUnit").value), amount: amt === "" ? null : Number(amt), status: st,
    settledDate: st === "settled" ? $("aSetDate").value : "", settledBy: st === "settled" ? $("aBy").value.trim() : "", note: $("aNote").value.trim(),
    evidence: [...document.querySelectorAll(".aEv:checked")].map(e => e.value), evStatus: $("aEvSt").value, evidenceNote: $("aEvNote").value.trim(), updatedAt: Date.now(), by: auth?.email || "demo" };
  const id = aid || uid();
  state.arrears[id] = { ...(state.arrears[id] || { createdAt: Date.now() }), ...data };
  const m = state.members[memberId], patch = (!m.gainCheck || m.gainCheck !== "has") ? { gainCheck: "has" } : null;
  if (patch) Object.assign(m, patch);
  toast("保存しました");
  if (cont) { openArrear(memberId); $("aDate").value = date; } else { closeModal(); }
  render();
  await save(aid ? "PATCH" : "PUT", `arrears/${id}`, aid ? data : state.arrears[id]);
  if (patch) await save("PATCH", `members/${memberId}`, patch);
}
function delArrear(aid) {
  confirmBox("この未入金の記録を削除しますか？", async () => { delete state.arrears[aid]; render(); toast("削除しました"); await save("DELETE", `arrears/${aid}`); });

function exportArrCSV() {
  const head = ["サロンNo", "氏名", "サロン名", "聞き取り", "取引日", "商品", "個数", "単価", "金額", "状態", "精算日", "精算者", "証拠", "証拠の保管場所・補足", "メモ"];
  const rows = Object.values(state.arrears).map(x => { const m = state.members[x.memberId] || {}; return [m.salonNo, m.name, m.nick, CHECK[m.gainCheck || "unchecked"], x.date || "日付不明", x.item, x.qty, x.unitPrice, amtUnknown(x) ? "金額未確定" : arrAmt(x), ARR_ST[x.status || "unpaid"], x.settledDate, x.settledBy, evState(x) === "have" ? (x.evidence || []).filter(k => EVID[k]).map(k => EVID[k]).join("・") : evState(x) === "none" ? "存在しない" : evState(x) === "requested" ? "提出を依頼中" : "未収集", x.evidenceNote, x.note]; })
    .sort((a, b) => String(a[0] || "~").localeCompare(String(b[0] || "~"), "ja", { numeric: true }) || String(a[4]).localeCompare(String(b[4])));
  const csv = [head, ...rows].map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
  a.download = `GILD_GAIN未入金_${todayStr()}.csv`; a.click();
}

function feeBulkDefault() { return curYM() < "2026-12" ? "2026-12" : ""; }
function doFeeBulk() {
  const e = $("fbEntry").value, f = $("fbFee").value, all = $("fbScope").value === "all", from = $("fbFrom").value;
  if (e === "" && f === "") { alert("入会金か月額を入力してください"); return; }
  const patches = {};
  membersArr().filter(m => m.status !== "left").forEach(m => {
    const p = {};
    if (e !== "" && (all || m.entryFee == null || m.entryFee === "")) p.entryFee = Number(e);
    if (f !== "" && from) { p[`feeHistory/${from}`] = { from, fee: Number(f) }; if (m.fee == null || m.fee === "") p.fee = Number(f); }

    for (const [id, p] of Object.entries(patches)) for (const [k2, v] of Object.entries(p)) {
      if (k2.startsWith("feeHistory/")) { const mm = state.members[id]; mm.feeHistory = { ...(mm.feeHistory || {}), [v.from]: v }; } else state.members[id][k2] = v; }
    render(); toast(`${n}人分を設定しました`);
    const body = {}; for (const [id, p] of Object.entries(patches)) for (const [k, v] of Object.entries(p)) body[`${id}/${k}`] = v;
    await save("PATCH", "members", body);

}

/* ---------- MTG予定・実施状況のまとめて登録 ---------- */
function openSched() {
  modal(`<h3>ミーティング予定をまとめて登録</h3>
    <p class="hint">全体ミーティング後に組んだ個別ミーティングの一覧を、そのまま貼り付けられます。1行に1人、<b>サロンNo（先頭の数字）・日時 または「済」</b>を読み取ります。<br>
    ・今日より後の日時 → 「次回MTG」に予定として登録<br>・今日以前の日時 → その日付で「実施済み」のミーティング記録を作成<br>・「済」だけ → 「実施済み（日付不明）」の記録を作成<br>・日時も「済」もない行 → 何もしません<br>
    行に「ANDO」「HAK」があれば担当をHAK代表、「KANETAKA」があればKANETAKA代表にします。同じ内容の記録がすでにある場合は二重に作りません。</p>
    <div class="f"><label>記録に付けるメモ</label><input id="schNote" value="全体ミーティング後の個別ミーティング"></div>
    <div class="f"><textarea id="schTxt" style="min-height:220px" placeholder="01きくりん　済&#10;05toshi　11/17 19:00~&#10;42うめさか　11/11 23:00~ ANDO"></textarea></div>
    <div id="schPrev"></div>
    <div class="mact"><button class="btn" onclick="closeModal()">キャンセル</button><button class="btn" onclick="previewSched()">確認する</button><button class="btn pri" id="schGo" onclick="doSched()" disabled>登録</button></div>`);
  $("schTxt").oninput = () => { $("schGo").disabled = true; $("schPrev").innerHTML = ""; };
}
function parseSched() {
  const byNoMap = {}; membersArr().forEach(m => { if (m.salonNo) byNoMap[String(Number(m.salonNo))] = m; });
  const t = todayStr(), y = Number(t.slice(0, 4)), cm = Number(t.slice(5, 7));
  const rows = [], bad = [];
  for (const raw of $("schTxt").value.split(/\r?\n/)) {
    const l = raw.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/：/g, ":").replace(/／/g, "/").trim();
    if (!l || /^【/.test(l)) continue;
    const mNo = l.match(/^(\d{1,4})/); if (!mNo) { bad.push(raw + "（先頭にサロンNoがありません）"); continue; }
    const m = byNoMap[String(Number(mNo[1]))]; if (!m) { bad.push(raw + "（このサロンNoの会員がいません）"); continue; }
    const rest = l.slice(mNo[1].length);
    const host = /ANDO|安藤|HAK/i.test(rest) ? "HAK代表" : /KANETAKA|金髙|金高/i.test(rest) ? "KANETAKA代表" : "";
    const d = rest.match(/(?:(\d{4})[\/\-年])?(\d{1,2})[\/月](\d{1,2})日?/), tm = rest.match(/(\d{1,2}):(\d{2})/);
    if (d) {
      let yy = d[1] ? Number(d[1]) : y; const mo = Number(d[2]);
      if (!d[1] && mo - cm > 6) yy--; if (!d[1] && cm - mo > 6) yy++;
      const date = `${yy}-${String(mo).padStart(2, "0")}-${String(Number(d[3])).padStart(2, "0")}`, time = tm ? `${tm[1].padStart(2, "0")}:${tm[2]}` : "";
      rows.push({ m, kind: date > t ? "next" : "done", date, time, host });
    } else if (/済/.test(rest)) rows.push({ m, kind: "doneUnknown", date: "", time: "", host });
  }
  return { rows, bad };
}
function previewSched() {
  const { rows, bad } = parseSched();
  const lab = r => r.kind === "next" ? `<span class="tag t-blue" style="background:var(--blue-soft);color:var(--blue)">次回予定</span> ${fmtDY(r.date)}${r.time ? " " + r.time + "〜" : ""}`
    : r.kind === "done" ? `<span class="tag t-green">実施済み</span> ${fmtDY(r.date)}${r.time ? " " + r.time + "〜" : ""}` : `<span class="tag t-green">実施済み</span> <span class="tag t-orange">日付不明</span>`;
  $("schPrev").innerHTML = `<div class="hint" style="margin-bottom:6px">${rows.length}人分を読み取りました。名前とサロン名が合っているか確認してから「登録」を押してください。</div>
    <div class="scroll" style="max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px"><table class="tbl" style="border:0">
    <tr><th>No</th><th>氏名（サロン名）</th><th>登録内容</th><th>担当</th></tr>
    ${rows.map(r => `<tr><td>${esc(r.m.salonNo)}</td><td>${esc(r.m.name)}${r.m.nick ? `（${esc(r.m.nick)}）` : ""}</td><td>${lab(r)}</td><td>${esc(r.host)}</td></tr>`).join("")}</table></div>
    ${bad.length ? `<div class="err" style="margin-top:8px">読み取れなかった行：<br>${bad.map(esc).join("<br>")}</div>` : ""}`;
  $("schGo").disabled = !rows.length;
}
async function doSched() {
  const { rows } = parseSched(), note = $("schNote").value.trim();
  const addM = {}, patches = {}; let nNext = 0, nDone = 0, skip = 0;
  for (const r of rows) {
    if (r.kind === "next") { patches[r.m.id] = { nextMtg: r.date, nextMtgTime: r.time }; nNext++; continue; }
    const dup = meetingsOf(r.m.id).some(x => (x.date || "") === r.date && (r.kind === "done" || (x.notes || "").includes(note)));
    if (dup) { skip++; continue; }
    addM[uid()] = { memberId: r.m.id, date: r.date, host: r.host, notes: note + (r.time ? `（${r.time}〜）` : ""), care: "", next: "", careDone: false, createdAt: Date.now(), by: auth?.email || "demo" };
    if (r.m.nextMtg && r.date && r.m.nextMtg <= r.date) patches[r.m.id] = { ...(patches[r.m.id] || {}), nextMtg: "", nextMtgTime: "" };
    nDone++;
  }
  Object.assign(state.meetings, addM);
  for (const [id, pt] of Object.entries(patches)) Object.assign(state.members[id], pt);
  closeModal(); render(); toast(`次回予定${nNext}件・実施済み${nDone}件を登録しました${skip ? `（登録済み${skip}件はスキップ）` : ""}`);
  if (Object.keys(addM).length) await save("PATCH", "meetings", addM);
  for (const [id, pt] of Object.entries(patches)) await save("PATCH", `members/${id}`, pt);
}

  if (st) return "store"; if (on) return "online"; return "none";
}
function normStatus(v) { v = (v || "").trim(); return /退会予定/.test(v) ? "leaving" : /退会/.test(v) ? "left" : /停止|休会/.test(v) ? "paused" : "active"; }
function normDate(v) {
  const m = String(v || "").trim().match(/^(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/);
  return m ? `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}` : "";
}
async function doBulk() {
  const lines = $("bulkTxt").value.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) { alert("登録できる行がありません"); return; }
  const split = l => (l.includes("\t") ? l.split("\t") : l.split(",")).map(x => x.trim());
  const alias = { salonNo: /サロン\s*(No|ナンバー|番号)|^No$/i, name: /^氏名$|^名前$/, kana: /ふりがな|フリガナ|かな/, nick: /あだ名|サロン名|ニックネーム/,
    course: /コース|プラン/, status: /状態/, email: /メール/, phone: /電話/, joinDate: /入会日|登録日/, fee: /月額/ };
  let cols = null, start = 0;
  const head = split(lines[0]);
  if (head.some(h => /氏名|名前/.test(h))) {
    cols = {}; head.forEach((h, i) => { for (const [k, re] of Object.entries(alias)) if (cols[k] === undefined && re.test(h)) { cols[k] = i; break; } });
    start = 1;
  } else cols = { name: 0, nick: 1, course: 2, joinDate: 3, fee: 4 }; // 見出しなし（旧形式）
  const exist = new Set(membersArr().map(m => m.salonNo).filter(Boolean));
  const add = {}; let skip = 0;
  for (const l of lines.slice(start)) {
    const c = split(l), g = k => cols[k] === undefined ? "" : (c[cols[k]] || "").trim();
    const name = g("name"); if (!name) continue;
    const no = g("salonNo");
    if (no && exist.has(no)) { skip++; continue; }
    if (no) exist.add(no);
    const fee = g("fee").replace(/[^\d]/g, "");
    add[uid()] = { salonNo: no, name, kana: g("kana"), nick: g("nick"), course: normCourse(g("course")), status: normStatus(g("status")),
      email: g("email"), phone: g("phone"), joinDate: normDate(g("joinDate")), fee: fee ? Number(fee) : null, entryPaid: false, createdAt: Date.now() };
  }
  const n = Object.keys(add).length;
  if (!n) { alert(skip ? `すべて登録済みのサロンNoでした（${skip}件）` : "登録できる行がありません"); return; }
  Object.assign(state.members, add); closeModal(); render(); toast(`${n}人を登録しました${skip ? `（登録済み${skip}件はスキップ）` : ""}`);
  await save("PATCH", "members", add);
}
function exportCSV() {
  const k = curYM();
  const head = ["サロンNo", "氏名", "ふりがな", "サロン名", "コース", "状態", "入会日", "入会金", "入会金支払い", "月額", `${k}支払い`, "次回MTG", "前回MTG", "運営側でやること（未対応）", "メール", "電話番号", "LINE名など", "メモ", "紹介者", "契約書", "締結日", "目標", "今の状況", "注意・違反の件数"];
  const rows = membersArr().map(m => [m.salonNo, m.name, m.kana, m.nick, COURSES[m.course], STATUS[m.status || "active"], m.joinDate, m.entryFee, (e => e.st === "done" ? "済" : e.st === "part" ? `一部（残り${e.rest}円）` : "未")(entryInfo(m)), feeFor(m, k), isPaid(m.id, k) ? "済" : "未", m.nextMtg, lastMtg(m.id), openCare(m.id).length, m.email, m.phone, m.contact, m.memo, refName(m), CONTRACT[m.contractStatus || "none"], m.contractDate, m.goal, m.progress, warnCount(m.id)]);
  const csv = [head, ...rows].map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
  a.download = `GILD会員_${todayStr()}.csv`; a.click();
}
